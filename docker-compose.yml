# Orquestación de TaskFlow con Docker Compose.
# Uso: docker compose up -d --build  →  http://localhost:8080

services:
  taskflow-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskflow-web:latest
    container_name: taskflow-web
    ports:
      - "8080:80"        # equipo:contenedor
    restart: unless-stopped
    healthcheck:
      # Comprueba que Nginx responde. wget viene incluido en Alpine.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
