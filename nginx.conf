# Configuración de Nginx para servir TaskFlow (Flutter Web).
# Se copia en la imagen como /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los archivos de texto que genera Flutter Web.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    # Navegación SPA: si la ruta no corresponde a un archivo real,
    # se entrega index.html y Flutter decide qué pantalla mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos que indican qué versión de la app cargar: nunca se guardan en
    # caché, para que el navegador reciba siempre la última compilación.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* ^/(flutter_bootstrap\.js|flutter_service_worker\.js|flutter\.js|main\.dart\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Recursos estáticos (fuentes, íconos, imágenes, CanvasKit): caché de 7 días.
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|ttf|otf|woff2?|wasm)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
